function visibleSteps(data){ return STEPS.filter(s=>!s.cond || s.cond(data)); }

function computeBundleSavings(d){
  let s=0;
  if(d.lineType==="bundle") s+=350;
  const discountCount=(d.discounts||[]).filter(x=>x!=="None of these").length + (d.coastalRisk||[]).filter(x=>x!=="None yet").length;
  s += discountCount*45;
  if(d.roofAge==="0-5"||d.roofAge==="6-10") s+=60;
  if((d.oldSystems||[]).includes("None of these")) s+=25;
  return s;
}

// ---------- tiny API helper ----------
async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers||{}) },
  });
  if(!res.ok){
    let msg = "Request failed";
    try{ msg = (await res.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : res.text();
}
function adminApi(path, opts={}){
  const token = localStorage.getItem("fala-admin-token") || "";
  return api("/api/admin"+path, { ...opts, headers: { Authorization: "Bearer "+token, ...(opts.headers||{}) } });
}

    a:"No worries -- tell me which question you're stuck on and I'll explain it, or say \"call me\" and I'll get the agent to reach out directly." },
];
function widgetMatchFaq(text){
  const t = text.toLowerCase();
  for(const f of WIDGET_FAQS){ if(f.kw.some(k=>t.includes(k))) return f.a; }
  return null;
}
const WIDGET_CALLBACK_STEPS = [
  { id:"name", q:"Sure -- what's your name?", validate:v=>v.trim().length>1 || "Just need a first name at least." },
  { id:"phone", q:"Best phone number to reach you?", validate:v=>v.replace(/\D/g,"").length>=10 || "That doesn't look like a full 10-digit number." },
  { id:"email", q:"And your email?", validate:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || "That email doesn't look quite right." },
];
function ChatWidget({ config, apiBase }){
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([{ from:"bot", text:"Quick question about the form? Ask away, or say \"call me\" for a callback." }]);
  const [input, setInput] = useState("");
  const [mode, setMode] = useState("faq");
  const [stepIdx, setStepIdx] = useState(0);
  const [data, setData] = useState({});
  const [typing, setTyping] = useState(false);
  const [done, setDone] = useState(false);
  const scrollRef = useRef(null);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, typing, open]);

  function pushBot(text, delay=400){
    setTyping(true);
    setTimeout(()=>{ setTyping(false); setMessages(m=>[...m, { from:"bot", text }]); }, delay);
  }
  function pushUser(text){ setMessages(m=>[...m, { from:"user", text }]); }

  async function finishCallback(d){
    setTyping(true);
    try{
      const payload = { name:d.name, phone:d.phone, email:d.email, bestTime:"anytime", source:"widget", note:"Requested a callback via in-form chat widget." };
      const res = await fetch(`${apiBase}/api/leads`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      const lead = await res.json();
      setTyping(false);
      if(!res.ok) throw new Error(lead.error || "failed");
      setDone(true);
      pushBot(`Got it, ${d.name.split(" ")[0]} -- ${config && config.agentName ? config.agentName : "the agent"} will reach out shortly. You can keep filling out the form too, whichever gets there first.`);
    }catch(e){
      setTyping(false);
      pushBot("Something went wrong on that -- mind just finishing the form instead? It submits the same info.");
      setMode("faq");
    }
  }

  function send(text){
    const trimmed = (text||"").trim();
    if(!trimmed) return;
    pushUser(trimmed);
    setInput("");
    if(mode === "callback"){
      const step = WIDGET_CALLBACK_STEPS[stepIdx];
      const ok = step.validate(trimmed);
      if(ok !== true){ pushBot(typeof ok==="string" ? ok : "Could you rephrase that?"); return; }
      const next = { ...data, [step.id]: trimmed };
      setData(next);
      const nextIdx = stepIdx + 1;
      if(nextIdx < WIDGET_CALLBACK_STEPS.length){ setStepIdx(nextIdx); pushBot(WIDGET_CALLBACK_STEPS[nextIdx].q); }
      else finishCallback(next);
      return;
    }
    if(/\b(call me|callback|call back|talk to someone|call.*agent)\b/i.test(trimmed)){
      pushBot("No problem.");
      setTimeout(()=>{ setMode("callback"); setStepIdx(0); setData({}); pushBot(WIDGET_CALLBACK_STEPS[0].q); }, 400);
      return;
    }
    const answer = widgetMatchFaq(trimmed);
    pushBot(answer || "Don't have a canned answer for that -- say \"call me\" and I'll have the agent reach out directly.");
  }

  const wStyles = {
    fab:{ position:"fixed", bottom:20, right:20, width:56, height:56, borderRadius:99, background:"#8A2E2E", color:"#FFFDF9", border:"none", fontSize:24, cursor:"pointer", boxShadow:"0 6px 18px rgba(28,43,51,0.25)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center" },
    panel:{ position:"fixed", bottom:88, right:20, width:320, maxWidth:"calc(100vw - 32px)", height:420, maxHeight:"calc(100vh - 120px)", background:"#FFFDF9", border:"1px solid rgba(28,43,51,0.14)", borderRadius:16, boxShadow:"0 12px 32px rgba(28,43,51,0.22)", zIndex:200, display:"flex", flexDirection:"column", overflow:"hidden" },
    head:{ padding:"12px 14px", borderBottom:"1px solid rgba(28,43,51,0.14)", display:"flex", justifyContent:"space-between", alignItems:"center", fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:15 },
    closeBtn:{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"#6b7680" },
    scroll:{ flex:1, overflowY:"auto", padding:"12px" },
    row:{ display:"flex", marginBottom:8 },
    bubble:{ maxWidth:"82%", padding:"8px 11px", borderRadius:12, fontSize:13.5, lineHeight:1.4 },
    botBubble:{ background:"#EDE6D6", borderTopLeftRadius:3 },
    userBubble:{ background:"#2F5D50", color:"#FFFDF9", borderTopRightRadius:3 },
    inputRow:{ borderTop:"1px solid rgba(28,43,51,0.14)", padding:8, display:"flex", gap:6 },
    input:{ flex:1, border:"1px solid rgba(28,43,51,0.14)", borderRadius:8, padding:"8px 10px", fontSize:13.5, fontFamily:"inherit", outline:"none" },
    send:{ background:"#8A2E2E", color:"#FFFDF9", border:"none", borderRadius:8, padding:"0 12px", fontSize:13, fontWeight:600, cursor:"pointer" },
  };

  return (
    <React.Fragment>
      <button style={wStyles.fab} onClick={()=>setOpen(o=>!o)} aria-label="Chat with us">{open ? "\u2715" : "\uD83D\uDCAC"}</button>
      {open && (
        <div style={wStyles.panel}>
          <div style={wStyles.head}>
            <span>Quick question?</span>
            <button style={wStyles.closeBtn} onClick={()=>setOpen(false)}>Close</button>
          </div>
          <div style={wStyles.scroll} ref={scrollRef}>
            {messages.map((m,i)=>(
              <div key={i} style={{...wStyles.row, justifyContent: m.from==="user" ? "flex-end" : "flex-start"}}>
                <div style={{...wStyles.bubble, ...(m.from==="user" ? wStyles.userBubble : wStyles.botBubble)}}>{m.text}</div>
              </div>
            ))}
            {typing && (
              <div style={{...wStyles.row, justifyContent:"flex-start"}}>
                <div style={{...wStyles.bubble, ...wStyles.botBubble}}>...</div>
              </div>
            )}
          </div>
          {!done && (
            <div style={wStyles.inputRow}>
              <input style={wStyles.input} value={input} placeholder="Type here..." disabled={typing}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") send(input); }} />
              <button style={wStyles.send} onClick={()=>send(input)} disabled={typing}>Send</button>
            </div>
          )}
        </div>
      )}
    </React.Fragment>
  );
}

            <button style={styles.btnGhost} onClick={cancelSettings}>Cancel</button>
            <button style={styles.btnPrimary} onClick={saveSettings}>Save changes</button>
          </div>
        </React.Fragment>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

function visibleSteps(data){ return STEPS.filter(s=>!s.cond || s.cond(data)); }

function computeBundleSavings(d){
  let s=0;
  if(d.lineType==="bundle") s+=350;
  const discountCount=(d.discounts||[]).filter(x=>x!=="None of these").length + (d.coastalRisk||[]).filter(x=>x!=="None yet").length;
  s += discountCount*45;
  if(d.roofAge==="0-5"||d.roofAge==="6-10") s+=60;
  if((d.oldSystems||[]).includes("None of these")) s+=25;
  return s;
}

// ---------- tiny API helper ----------
async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers||{}) },
  });
  if(!res.ok){
    let msg = "Request failed";
    try{ msg = (await res.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : res.text();
}
function adminApi(path, opts={}){
  const token = localStorage.getItem("fala-admin-token") || "";
  return api("/api/admin"+path, { ...opts, headers: { Authorization: "Bearer "+token, ...(opts.headers||{}) } });
}

const DRAFT_KEY = "fala-quote-draft-v1";

function App(){
  const [screen, setScreen] = useState("intro");
  const [stepIndex, setStepIndex] = useState(0);
  const [data, setData] = useState({});
  const [stepError, setStepError] = useState(null);
  const [config, setConfig] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [draft, setDraft] = useState(null);
  const [hasDraft, setHasDraft] = useState(false);
  const [heroFraming] = useState("gain"); // 'gain' | 'loss' — swap for A/B testing the headline
  const [confettiEnabled] = useState(true);
  const [lastLead, setLastLead] = useState(null);
  const [addOns, setAddOns] = useState([]);
  const [referralCopied, setReferralCopied] = useState(false);
  const [declFile, setDeclFile] = useState(null);
  const [declStatus, setDeclStatus] = useState("idle"); // idle | uploading | done | error
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);

  // producer dashboard state
  const [pinValue, setPinValue] = useState("");
  const [pinError, setPinError] = useState(false);
  const [leads, setLeads] = useState([]);
  const [search, setSearch] = useState("");
  const [filterTag, setFilterTag] = useState("all");
  const [sortBy, setSortBy] = useState("date");
  const [openDetail, setOpenDetail] = useState({});
  const [configDraft, setConfigDraft] = useState(null);
  const [settingsSaved, setSettingsSaved] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const cfg = await api("/api/config/public");
        setConfig(cfg);
      } catch (e) {
        setConfig({ agentName:"Noah Bethay", agentPhone:"(504) 555-0100", avgSavings:847, rating:4.9, reviewCount:312, carrierCount:20, yearsInBusiness:69, reviewLink:"#", referralBonus:25 });
      }
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (raw) { const d = JSON.parse(raw); setDraft(d); setHasDraft(true); }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  function saveDraft(d){
    try{ if(d) localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); else localStorage.removeItem(DRAFT_KEY); }catch(e){}
  }

  function clickStart(){ setScreen("quiz"); setStepIndex(0); setData({}); setHasDraft(false); setStepError(null); saveDraft(null); }
  function startFresh(){ clickStart(); }
  function resumeDraft(){ if(!draft) return; setScreen("quiz"); setData(draft.data||{}); setStepIndex(draft.stepIndex||0); setHasDraft(false); }
  function goIntro(e){ if(e&&e.preventDefault) e.preventDefault(); setScreen("intro"); }
  function goPin(e){ if(e&&e.preventDefault) e.preventDefault(); setScreen("dash-pin"); setPinValue(""); setPinError(false); }

  function setAnswer(id, val){
    const next = { ...data, [id]: val };
    setData(next); setStepError(null);
    saveDraft({ data: next, stepIndex });
  }
  function toggleMulti(id, v){
    let arr = data[id] || [];
    const isNone = v.startsWith("None");
    if (isNone) arr = arr.includes(v) ? [] : [v];
    else { arr = arr.filter(x=>!x.startsWith("None")); arr = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]; }
    setAnswer(id, arr);
  }

  function currentStepDef(){ return visibleSteps(data)[stepIndex]; }

  async function goNextClick(){
    const step = currentStepDef();
    if(!step) return;
    const val = data[step.id];
    const requiresValue = ["text","tel","email","select"].includes(step.type);
    if(requiresValue){
      const trimmed = (val||"").toString().trim();
      if(!trimmed){ setStepError("This field is required."); return; }
      if(step.type==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)){ setStepError("Enter a valid email address."); return; }
      if(step.type==="tel" && trimmed.replace(/\D/g,"").length<10){ setStepError("Enter a 10-digit phone number."); return; }
    }
    const vis = visibleSteps(data);
    const nextIndex = stepIndex + 1;
    if(nextIndex >= vis.length){ await finishQuiz(); }
    else{ setStepIndex(nextIndex); setStepError(null); saveDraft({ data, stepIndex: nextIndex }); }
  }
  function goBack(){ if(stepIndex>0){ const i = stepIndex-1; setStepIndex(i); setStepError(null); saveDraft({ data, stepIndex: i }); } }

  async function finishQuiz(){
    setSubmitting(true); setSubmitError(null);
    try{
      const lead = await api("/api/leads", { method:"POST", body: JSON.stringify(data) });
      saveDraft(null);
      setLastLead(lead); setAddOns([]); setScreen("done");
    }catch(e){
      setSubmitError(e.message || "Something went wrong submitting your quote. Please try again or call/text us directly.");
    }finally{
      setSubmitting(false);
    }
  }

  async function uploadDeclarations(file){
    if(!file || !lastLead) return;
    if(file.size > 10*1024*1024){ setDeclStatus("error"); return; }
    setDeclFile(file);
    setDeclStatus("uploading");
    try{
      const fd = new FormData();
      fd.append("declarations", file);
      const res = await fetch(`${API}/api/leads/${lastLead.id}/declarations`, { method:"POST", body: fd });

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
